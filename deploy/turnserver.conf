# PyChatter TURN configuration for coturn
# Copy to /etc/turnserver.conf and adjust values for your domain.

# Network
listening-port=3478
fingerprint
use-auth-secret
static-auth-secret=CHANGE_ME_LONG_RANDOM_SECRET
realm=pychatter.example.com

# External/public address. Replace with your server public IP.
external-ip=217.216.40.246

# Protocols
no-tls
no-dtls

# Relay range
min-port=49160
max-port=49200

# Security / hygiene
no-multicast-peers
stale-nonce=600
no-cli

# Logging
simple-log
log-file=/var/log/turnserver/turn.log
