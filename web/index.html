<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PyChatter Web</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="authView" class="auth-view">
    <div class="auth-bg-grid"></div>
    <section class="auth-card">
      <div class="auth-brand">PyChatter</div>
      <h1 id="authTitle">Welcome back</h1>
      <p id="authSubtitle">Log in to continue chatting with your server.</p>

      <div class="auth-switch">
        <button id="showLoginBtn" class="auth-tab active" type="button">Sign In</button>
        <button id="showRegisterBtn" class="auth-tab" type="button">Register</button>
      </div>

      <form id="authForm" class="auth-form">
        <label>
          Username
          <input id="usernameInput" required minlength="3" maxlength="24" autocomplete="username">
        </label>
        <label>
          Password
          <input id="passwordInput" type="password" required minlength="6" autocomplete="current-password">
        </label>
        <label class="remember-row">
          <input id="rememberMe" type="checkbox" checked>
          <span>Remember me on this device</span>
        </label>
        <button id="authSubmitBtn" type="submit" class="btn primary">Sign In</button>
      </form>
      <p id="authStatus" class="auth-status"></p>
    </section>
  </div>

  <main id="appView" class="app hidden">
    <aside class="server-rail">
      <div class="server-pill active">P</div>
      <div class="server-pill">+</div>
    </aside>

    <aside class="channels-pane">
      <div class="pane-title">PyChatter</div>
      <section class="pane-block">
        <div class="block-head">
          <h2>Text Channels</h2>
          <button id="newChannelBtn" class="icon-btn" title="New Channel" type="button">+</button>
        </div>
        <ul id="channels" class="list channel-list"></ul>
      </section>
      <footer class="self-card">
        <div class="self-avatar"></div>
        <div>
          <div id="selfUser" class="self-user">guest</div>
          <div id="statusText" class="self-meta">Connecting...</div>
        </div>
      </footer>
    </aside>

    <section class="chat-pane">
      <header class="chat-topbar">
        <div>
          <div id="channelTitle" class="chat-title">#general</div>
          <div id="channelMeta" class="chat-meta">Community chat</div>
        </div>
        <div id="roleBadge" class="role-badge">member</div>
      </header>

      <section id="messages" class="messages"></section>

      <section id="callPanel" class="call-panel hidden">
        <div id="callStatus" class="call-status">No active call</div>
        <div class="video-grid">
          <video id="remoteVideo" autoplay playsinline></video>
          <video id="localVideo" autoplay playsinline muted></video>
        </div>
      </section>

      <footer class="composer">
        <input id="messageInput" type="text" placeholder="Message #general">
        <button id="sendBtn" class="btn primary" type="button">Send</button>
      </footer>
      <div id="typingIndicator" class="typing-indicator"></div>
    </section>

    <aside class="members-pane">
      <section class="pane-block">
        <div class="block-head">
          <h2>Members</h2>
          <button id="refreshUsersBtn" class="icon-btn" title="Refresh" type="button">R</button>
        </div>
        <ul id="users" class="list user-list"></ul>
      </section>

      <section class="pane-block">
        <h2>Actions</h2>
        <div class="stack">
          <button id="callBtn" class="btn ghost" type="button">Start Voice/Video</button>
          <button id="hangupBtn" class="btn ghost" type="button">End Call</button>
          <button id="toggleMicBtn" class="btn ghost" type="button">Toggle Mic</button>
          <button id="toggleCamBtn" class="btn ghost" type="button">Toggle Camera</button>
          <button id="changeNameBtn" class="btn ghost" type="button">Change Username</button>
          <button id="dmBtn" class="btn ghost" type="button">Message User</button>
          <button id="dmHistoryBtn" class="btn ghost" type="button">View DM History</button>
          <button id="promoteBtn" class="btn ghost" type="button">Set Member Role</button>
          <button id="logoutBtn" class="btn ghost" type="button">Log Out</button>
        </div>
      </section>
    </aside>
  </main>

  <script src="/app.js"></script>
</body>
</html>
